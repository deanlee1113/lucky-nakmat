.card{background:#fff;padding:22px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h1{font-size:26px;margin:0 0 6px;color:#2a2d4a;font-weight:700}
.sub{color:#777;font-size:15px;margin-bottom:20px}
label{display:block;font-weight:700;font-size:17px;margin-bottom:8px;color:#333}
.opt{font-size:13px;color:#888;font-weight:400;margin-left:6px}
input[type=text],input[type=time],input[type=date],select{width:100%;padding:14px 14px;font-size:17px;border:1px solid #dde0e6;border-radius:8px;background:#f9fafc}
input:focus,select:focus{outline:none;border-color:#5b6cf3;background:#fff}
.field{margin-bottom:18px}
.hint{font-size:14px;color:#7c8aa8;margin-top:6px}
button{width:100%;padding:16px;background:linear-gradient(135deg,#5b6cf3,#8b5cf6);color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;margin-top:8px}
button:hover{filter:brightness(1.05)}
button:disabled{opacity:.5;cursor:not-allowed}
.rating{font-size:34px;text-align:center;letter-spacing:2px;margin:10px 0}
.headline{text-align:center;font-size:20px;font-weight:700;color:#2a2d4a;margin-bottom:8px;line-height:1.4}
.date{text-align:center;color:#888;font-size:15px;margin-bottom:16px}
.cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{background:#f7f8fb;border-radius:10px;padding:14px}
.mini .ico{font-size:22px}
.mini .lbl{font-size:13px;color:#888;margin:4px 0}
.mini .val{font-size:16px;font-weight:700;color:#2a2d4a;line-height:1.3}
.mini .desc{font-size:14px;color:#666;margin-top:6px;line-height:1.4}
.full{grid-column:1/3}
.section-title{font-size:18px;font-weight:700;margin:16px 0 10px;color:#333;display:flex;align-items:center;gap:6px}
.event{background:#f7f8fb;border-left:4px solid #5b6cf3;padding:14px 16px;margin-bottom:10px;border-radius:0 8px 8px 0}
.event.bad{border-left:6px solid #e0526a;background:#fff0f1;box-shadow:0 2px 6px rgba(224,82,106,.15)}
.event .term{font-size:15px;font-weight:700;color:#5b6cf3}
.event.bad .term{color:#c8243d;font-size:16px}
.event .gloss{font-size:16px;color:#222;margin-top:4px;font-weight:500}

.event.bad .meta{background:#fff;padding:10px 12px;border-radius:6px;color:#444;border-left:3px solid #e0526a}

.warn-card .section-title{color:#d4691a}
.warn-item{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px;border-left:3px solid #ffa940}
.warn-item .lbl{font-size:13px;font-weight:700;color:#d4691a;margin-bottom:2px}

.samyung .lbl{font-size:14px;color:#777}
.samyung .desc{font-size:15px;color:#333;margin-top:6px;line-height:1.5}

.unlock-btn:hover{filter:brightness(1.05)}
.unlock-btn.unlocked{background:#52c41a}
.unlock-content{display:none;margin-top:14px;background:linear-gradient(135deg,#fff7e8,#fff);padding:18px;border-radius:12px;border:2px solid #ffa940;box-shadow:0 4px 14px rgba(255,169,64,.18)}
.unlock-content.show{display:block;animation:unlockGlow 1.4s ease-out}

.unlock-content h4:first-of-type{margin-top:0}
.unlock-content p{font-size:15px;color:#333;line-height:1.7;margin:6px 0}

.detail-toggle:hover{background:#dde7fb;border-color:#5b6cf3}
.detail-toggle:active{transform:scale(0.98)}
.detail-pane{display:none;background:#fafbfc;padding:14px;border-radius:8px;margin-top:10px;font-size:13px}
.detail-pane.show{display:block}
.detail-pane h4{margin:8px 0 5px;font-size:14px;color:#5b6cf3}

.pcell.life{background:#fff3f3;border-color:#e0526a}
.pcell.key{background:#eef3ff}
.pcell .gz{color:#e0526a;font-size:10px}
.pcell .pn{color:#444;font-size:10px;font-weight:600}
.pcell .stars{margin-top:3px}
.pcell .star{display:inline-block;background:#fffbcc;padding:1px 4px;margin:1px 1px 0 0;border-radius:3px;font-size:10px}
.footer{font-size:13px;color:#9aa3b3;text-align:center;margin-top:24px;padding:14px;line-height:1.6}
.err{color:#e0526a;font-weight:700;text-align:center;padding:18px;font-size:16px}

.action-btn:hover{background:#eef3ff;border-color:#5b6cf3}
.action-btn:active{transform:scale(0.97)}
.action-btn.primary{background:#fff5e6;border-color:#ffa940;color:#d4691a}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:14px 22px;border-radius:10px;font-size:15px;font-weight:600;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ad-wrap{margin:14px 0;text-align:center}
.ad-wrap:empty{display:none}

<div class="wrap">
<div class="card">
<h1>🎣 자미두수 출조 운세</h1>
<div class="sub">자미두수 원리로 오늘 낚시 운세를 봅니다 (재미로 보는 운세)</div>

<div class="field">
<label>생년월일 <span class="opt">양력 8자리</span></label>
<input type="text" id="solar" placeholder="예: 19900315" maxlength="8" inputmode="numeric">
</div>

<div class="field">
<label>출생 시간 <span class="opt">모르면 '모름' 선택</span></label>
<select id="hour">
<option value="모름">모름 (정오 가정)</option>
<option value="자시">자시 (23~01시)</option>
<option value="축시">축시 (01~03시)</option>
<option value="인시">인시 (03~05시)</option>
<option value="묘시">묘시 (05~07시)</option>
<option value="진시">진시 (07~09시)</option>
<option value="사시">사시 (09~11시)</option>
<option value="오시">오시 (11~13시)</option>
<option value="미시">미시 (13~15시)</option>
<option value="신시">신시 (15~17시)</option>
<option value="유시">유시 (17~19시)</option>
<option value="술시">술시 (19~21시)</option>
<option value="해시">해시 (21~23시)</option>
</select>
</div>

<div class="field">
<label>낚시 가는 날짜</label>
<input type="date" id="fdate">
</div>

<div class="field">
<label>이름 <span class="opt">선택 — 입력 시 성명학 분석 추가</span></label>
<input type="text" id="name" placeholder="예: 홍길동">
</div>

<button onclick="run()">운세 보기</button>
</div>

<div id="result"></div>

<div class="footer">
본 콘텐츠는 자미두수 원리를 단순화한 엔터테인먼트입니다.<br>
정확한 명반 분석은 전문 명리상담사를 찾아주세요.<br><br>
<span style="font-size:11px;color:#aab">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span>
</div>
</div>

// ============ 음력 변환 ============
function lunarOf(s){
if(!/^\d{8}$/.test(s))return null;
const y=+s.substring(0,4),m=+s.substring(4,6),d=+s.substring(6,8);
try{
const c=new KoreanLunarCalendar();
if(!c.setSolarDate(y,m,d))return null;
const l=c.getLunarCalendar();
return{year:l.year,month:l.month,day:l.day,leap:!!l.intercalation};
}catch(e){return null;}
}

// HH:MM → 시진명
function hmToHourName(h){
if(isNaN(h))return null;
if(h===23||h===0)return'자시';
if(h<3)return'축시';if(h<5)return'인시';if(h<7)return'묘시';
if(h<9)return'진시';if(h<11)return'사시';if(h<13)return'오시';
if(h<15)return'미시';if(h<17)return'신시';if(h<19)return'유시';
if(h<21)return'술시';return'해시';
}

// ============ 12궁 + 14주성 ============
function buildChart(solar,hour){
const lu=lunarOf(solar);if(!lu)return null;
let hi=HOUR_NAMES.indexOf(hour);
const isUnknown=hi<=0;
if(isUnknown)hi=7;
const m=lu.leap?lu.month+1:lu.month;
const lifeIdx=((1+m-hi)%12+12)%12;

// 12궁 배치
const palaces={};
for(let i=0;i<12;i++){
const b=((lifeIdx-i)%12+12)%12;
palaces[PALACE_NAMES[i]]={branchIdx:b,branchHan:BR_HAN[b]};
}

// 12궁 천간 (五虎遁)
const ys=((lu.year-4)%10+10)%10;
const yb=((lu.year-4)%12+12)%12;
const yinSt=WUHU_DUN[ys];
const palaceStems=new Array(12);
for(let i=0;i<12;i++)palaceStems[i]=((yinSt+i-2)%10+10)%10;

// 명궁 60갑자 → 五行局
const lifeBranch=palaces['명궁'].branchIdx;
const lifeStem=palaceStems[lifeBranch];
let gz=-1;
for(let n=0;n<60;n++)if(n%10===lifeStem&&n%12===lifeBranch){gz=n;break;}
const ju=NAYIN[gz];

// 자미 위치
const ziWei=ZIWEI_TBL[ju][lu.day-1];
const tianFu=((4-ziWei)%12+12)%12;

// 14주성 배치
const placement=Array.from({length:12},()=>[]);
ZIWEI_GRP.forEach(s=>{
const i=((ziWei+s.off)%12+12)%12;
placement[i].push({han:s.han,el:s.el});
});
TIANFU_GRP.forEach(s=>{
const i=((tianFu+s.off)%12+12)%12;
placement[i].push({han:s.han,el:s.el});
});

// 12궁에 별 + 천간 추가
Object.entries(palaces).forEach(([n,p])=>{
p.stem=palaceStems[p.branchIdx];
p.stemHan=STEMS_HAN[p.stem];
p.stars=placement[p.branchIdx];
});

return{
solar,hour,isUnknown,
lunar:lu,
year:{stem:ys,stemHan:STEMS_HAN[ys],branch:yb,branchHan:BR_HAN[yb]},
ju,juName:{2:'水二局',3:'木三局',4:'金四局',5:'土五局',6:'火六局'}[ju],
ziWei:BR_HAN[ziWei],tianFu:BR_HAN[tianFu],
palaces
};
}

// ============ 출조일 사화 + 매칭 ============
function getDayPillar(s){
const y=+s.substring(0,4),m=+s.substring(4,6),d=+s.substring(6,8);
const t=new Date(y,m-1,d),b=new Date(1900,0,1);
const diff=Math.round((t-b)/86400000);
return{stemIdx:((10+diff)%10+10)%10,branchIdx:((10+diff)%12+12)%12};
}

const KEYS=['명궁','천이궁','재백궁','복덕궁'];
const SAHWA_W={'화록':3,'화권':2,'화과':1,'화기':-3};

function matchSahwa(palaces,sahwa){
const pos=[],neg=[];
KEYS.forEach(pn=>{
(palaces[pn].stars||[]).forEach(st=>{
const isLife=pn==='명궁',m=isLife?1.5:1;
if(sahwa.록&&st.han===sahwa.록)pos.push({star:st.han,palace:pn,type:'화록',score:SAHWA_W['화록']*m,isLife});
if(sahwa.권&&st.han===sahwa.권)pos.push({star:st.han,palace:pn,type:'화권',score:SAHWA_W['화권']*m,isLife});
if(sahwa.과&&st.han===sahwa.과)pos.push({star:st.han,palace:pn,type:'화과',score:SAHWA_W['화과']*m,isLife});
if(sahwa.기&&st.han===sahwa.기)neg.push({star:st.han,palace:pn,type:'화기',score:SAHWA_W['화기']*m,isLife});
});
});
return{pos,neg};
}

function rateOf(s){if(s>=2.5)return 5;if(s>=1)return 4;if(s>=-0.5)return 3;if(s>=-2)return 2;return 1;}

// ============ 성명학 ============
function nameOhang(n){
if(!n)return null;
const t=n.trim();if(!t)return null;
const c=t.charCodeAt(0);
if(c<0xAC00||c>0xAC00+11171)return null;
const i=Math.floor((c-0xAC00)/588);
return{ch:t[0],oh:INITIAL_OH[i]};
}

function samyungScore(nameOh,palaceOh){
if(!nameOh||!palaceOh)return null;
const a=nameOh,b=palaceOh;
if(a===b)return{score:95,rel:'비화 (같은 오행)',desc:'명궁과 같은 오행 — 자연스럽게 어울리는 기운'};
if(SHENG[a]===b)return{score:85,rel:'상생',desc:'이름이 명궁을 살려주는 관계 — 좋은 도움 기운'};
if(SHENG[b]===a)return{score:80,rel:'상생',desc:'명궁이 이름을 받쳐주는 관계 — 안정 기운'};
if(KE[a]===b)return{score:40,rel:'상극',desc:'이름이 명궁을 누르는 관계 — 살짝 부딪힘'};
if(KE[b]===a)return{score:50,rel:'상극',desc:'명궁이 이름을 누르는 관계 — 약간의 마찰'};
return{score:60,rel:'중성',desc:'특별한 작용 없음'};
}

// ============ 결과 카드 ============
function getMain(palaces,name,fb){
const s=palaces[name].stars;
if(s&&s.length>0)return s[0];
if(fb){const f=palaces[fb].stars;if(f&&f.length>0)return f[0];}
return null;
}

function buildCards(palaces){
const lifeM=getMain(palaces,'명궁','천이궁');
const moveM=getMain(palaces,'천이궁','명궁');
const moveB=palaces['천이궁'].branchIdx;
const wealthB=palaces['재백궁'].branchIdx;
const joyB=palaces['복덕궁'].branchIdx;

let depth;
if([11,0,1].includes(wealthB))depth='깊은 수심 (15m+)';
else if([2,3,4].includes(wealthB))depth='중층 (5~15m)';
else if([5,6,7].includes(wealthB))depth='표층 (0~5m)';
else depth='바닥층';

return{
direction:DIRS[moveB],
direction_desc:DIR_DESC[DIRS[moveB]],
location:DIRS[wealthB]+' / '+depth,
bestTime:TIMES[joyB],
bestTime_desc:TIME_FRIENDLY[TIMES[joyB].hour],
color:lifeM?STAR_COLOR[lifeM.han]:'흰색·은색',
colorEl:lifeM?STAR_OH[lifeM.han]:'金',
fish:lifeM?STAR_FISH[lifeM.han]:'잡어 전반',
tackle:moveM?STAR_TACKLE[moveM.han]:'범용 찌낚시',
lifeStar:lifeM,
moveStar:moveM
};
}

// ============ 통합 ============
function fortune(solar,hour,fishingDate,name){
const ch=buildChart(solar,hour);if(!ch)return{error:'생년월일이나 시간을 확인해주세요'};
const dp=getDayPillar(fishingDate);
const sw=SAHWA[dp.stemIdx];
const{pos,neg}=matchSahwa(ch.palaces,sw);
let total=0;pos.forEach(p=>total+=p.score);neg.forEach(p=>total+=p.score);
const rating=rateOf(total);
const cards=buildCards(ch.palaces);
const nameOh=nameOhang(name);
const palaceMainOh=cards.lifeStar?({'土':'토','木':'목','火':'화','金':'금','水':'수'})[cards.lifeStar.el]:null;
const sm=samyungScore(nameOh?nameOh.oh:null,palaceMainOh);

return{
chart:ch,
fishingDate,
fullName:name||null,
dayStemHan:STEMS_HAN[dp.stemIdx],
sahwa:sw,
pos,neg,total,rating,cards,
samyung:nameOh?{score:sm.score,rel:sm.rel,desc:sm.desc,nameOh:nameOh.oh,ch:nameOh.ch,palaceOh:palaceMainOh}:null
};
}

function renderPalaceGrid(palaces){
// 4x4 그리드 (중앙 2x2 비움)
const POS={5:0,6:1,7:2,8:3,4:4,9:7,3:8,10:11,2:12,1:13,0:14,11:15};
const cells=new Array(16).fill(null);
Object.entries(palaces).forEach(([n,p])=>{cells[POS[p.branchIdx]]={name:n,...p};});
let h='<div class="palace-grid">';
const KEY=['명궁','천이궁','재백궁','복덕궁'];
for(let r=0;r<4;r++){
for(let c=0;c<4;c++){
const i=r*4+c;
if(i===5||i===6||i===9||i===10){h+='<div></div>';continue;}
const cell=cells[i];
if(!cell){h+='<div class="pcell"></div>';continue;}
let cls='pcell';
if(cell.name==='명궁')cls+=' life';
else if(KEY.includes(cell.name))cls+=' key';
h+='<div class="'+cls+'">';
h+='<div class="gz">'+cell.stemHan+cell.branchHan+'</div>';
h+='<div class="pn">'+cell.name+'</div>';
h+='<div class="stars">';
cell.stars.forEach(s=>{h+='<span class="star">'+s.han+'</span>';});
if(cell.stars.length===0)h+='<span style="color:#bbb;font-size:9px">空</span>';
h+='</div></div>';
}
}
h+='</div>';
return h;
}

// 쿠팡 다녀오기 + 즉시 잠금 해제 (모바일/인앱 브라우저 호환)
window.unlockDetail=function(type){
const btnMap={mega:['unlockMega','megaDetail']};
const[btnId,detailId]=btnMap[type];
const btn=document.getElementById(btnId);
const detail=document.getElementById(detailId);

// 쿠팡 새 창 시도 (성공/실패 무관)
window.open(COUPANG_LINK,'_blank','noopener,noreferrer');

// 즉시 잠금 해제 — 쿠팡 클릭 = 매출이라 시청 시간 강제 의미 없음
detail.classList.add('show');
btn.textContent='✓ 잠금 해제됨';
btn.classList.add('unlocked');
btn.disabled=true;
showToast('🎉 자세히 풀이가 열렸습니다');
setTimeout(()=>detail.scrollIntoView({behavior:'smooth',block:'start'}),300);
};

// ============ 이벤트 ============
function fmtDate(d){return d.replace(/-/g,'');}

// 오늘 날짜 기본값
const today=new Date();
document.getElementById('fdate').value=today.toISOString().substring(0,10);

window.run=function(){
const solar=document.getElementById('solar').value.trim();
const hour=document.getElementById('hour').value;
const fdate=document.getElementById('fdate').value;
const name=document.getElementById('name').value.trim();

if(!solar||!/^\d{8}$/.test(solar)){
document.getElementById('result').innerHTML='<div class="card err">생년월일을 8자리 숫자로 입력해주세요 (예: 19900315)</div>';return;
}
if(!fdate){
document.getElementById('result').innerHTML='<div class="card err">낚시 가는 날짜를 선택해주세요</div>';return;
}

const r=fortune(solar,hour,fmtDate(fdate),name);
document.getElementById('result').innerHTML=render(r);
window.scrollTo({top:document.getElementById('result').offsetTop-20,behavior:'smooth'});
// 결과 렌더링 후 카카오 광고 라이브러리 호출 (새로 박힌 ins 영역 인식용)
setTimeout(loadKakaoAds,100);
};
